<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e7e9ea;
    }
    .header .version {
      font-size: 11px;
      color: #71767b;
      background: #1d2226;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #1d2226;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f44;
    }
    .status-dot.connected { background: #0f0; }
    .status-text {
      font-size: 13px;
      color: #71767b;
    }
    .status-text.connected { color: #0f0; }
    .info {
      font-size: 12px;
      color: #71767b;
      line-height: 1.5;
      padding: 8px 12px;
      background: #1d2226;
      border-radius: 8px;
    }
    .info code {
      color: #1d9bf0;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Aether</h1>
    <span class="version">v0.1.0</span>
  </div>

  <div class="status" id="status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking...</span>
  </div>

  <div class="info">
    MCP Server: <code id="wsUrl">ws://localhost:3899</code><br>
    Start server with: <code>npx aether-server</code>
  </div>

  <script src="popup.js"></script>
</body>
</html>
